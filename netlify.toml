# Next.js on Netlify needs the Next.js runtime (server action, hourly GitHub cache, OG image).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Canonical URL, Open Graph, sitemap and structured data. Not a secret.
  NEXT_PUBLIC_SITE_URL = "https://lak5hya-portfolio.netlify.app"

# The contact form uses Netlify Forms (public/__forms.html). Submissions are emailed via Forms → notifications.
# Secrets go in Netlify → Site configuration → Environment variables, never in this file: optional GITHUB_TOKEN

# Declared explicitly: on this site the runtime was not auto-applied in Netlify's server builds (only the
# Neon extension ran), so the raw .next folder was published and every page returned 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers (CSP, nosniff, frame, referrer and permissions policies) are set in next.config.ts so they
# reach the HTML pages served by the Next.js runtime. HSTS is already sent for *.netlify.app.
